[project]
name = "policy-assistant"
version = "0.1.0"
description = "A RAG document assistant that answers questions over a set of policy documents, with citations."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "qdrant-client>=1.7",
    "fastembed>=0.3",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "rich>=13.7",
    "streamlit>=1.64.0",
]

[tool.uv]
package = false
